models:
  - name: dim_listings_cleansed
    description: This model represents the cleansed listings data from Airbnb.
    data_tests:
      - minimum_row_count:
          arguments:
            min_row_count: 10000000
          config:
            severity: warn
    columns:
     - name: listing_id
       description: Unique identifier for each listing.
       data_tests:
         - unique
         - not_null
     - name: host_id
       description: Unique identifier for the host of each listing.
       data_tests:
         - not_null
         - relationships:
             arguments:
               to: ref('dim_hosts_cleansed')
               field: host_id
     - name: room_type
       description: The type of room available for booking.
       data_tests:
         - accepted_values:
             arguments:
               values: ['Entire home/apt', 'Private room', 'Shared room', 'Hotel room']
     - name: minimum_nights
       description: '{{doc("dim_listing_cleansed__minimum_nights")}}'
       data_tests:
        - positive_values

  - name: dim_hosts_cleansed
    description: '{{doc("dim_hosts_cleansed_description")}}'
    config:
      contract: 
        enforced: true
    columns:
        - name: host_id
          data_type: integer
          data_tests:
           - unique
           - not_null
        - name: host_name
          data_type: string
          data_tests:
           - not_null
        - name: is_superhost
          data_type: string
          data_tests:
           - accepted_values:
               arguments:
                 values: ['t', 'f']
        - name: updated_at
          data_type: timestamp
        - name: created_at
          data_type: timestamp
    
  - name: fct_reviews
    columns:
       - name: listing_id
         data_tests:
           - not_null
           - relationships:
               arguments:
                 to: ref('dim_listings_cleansed')
                 field: listing_id
       - name: review_date
         data_tests:
           - not_null
       - name: review_sentiment
         data_tests:
           - accepted_values:
               arguments:
                 values: ['negative', 'positive','neutral']
       - name: review_text
         data_tests:
           - not_null
       - name: reviewer_name
         data_tests:
             - not_null